<script>
// 🫙 Gift jar — gifts viewers send drop into a glass jar and pile up. Add as a Link source (portrait, e.g. 600×800).
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PREVIEW = new URLSearchParams(location.search).has('preview');
let W = 0, H = 0, DPR = 1;
let cfg = { shape: 'jar', glass: '#bfe6ff', lid: 'metal', lidColor: '#ff7aa8', bow: true, bowColor: '#ff4f8b', label: 'โหลของขวัญ', labelColor: '#ffffff', labelBg: '#ff7aa8', showCount: true, itemSize: 1, sparkle: true, sound: true, volume: 0.4 };
let lidLift = 0, lidTilt = 0, lidPush = 0, lidSide = 0; // how far the gifts have pushed the lid up
let total = 0, best = null; // best: 👑 top giver
let ang = 0, angV = 0, shakeT = 0, shakePow = 0; // jar rocking / shaking
const tags = [], tagQ = [], confetti = [];
let party = null; // 🎉 jar-full show: { t, lid: { dy, vy, rot } }
const items = [], sparks = [];
let J = null; // jar geometry for the current size and shape

// ---------- pictures ----------
const imgCache = new Map();
function srcUrl(src) {
  src = String(src || '');
  if (/^gift:g\d{3}$/.test(src)) return `/gifts/${src.slice(5)}.png`;
  if (/^[a-z]{2,16}$/.test(src)) return `/assets/${src}.svg`;
  if (/^https?:\/\//.test(src)) return src;
  return '/assets/heart.svg';
}
function getImg(src) {
  const url = srcUrl(src);
  if (!imgCache.has(url)) {
    if (imgCache.size > 300) imgCache.delete(imgCache.keys().next().value);
    const im = new Image(); im.onerror = () => { im.failed = true; }; im.src = url; imgCache.set(url, im);
  }
  return imgCache.get(url);
}

// ---------- jar shape ----------
// Every shape is a left-right symmetric outline: half-width of the inside at height y (0 outside the jar).
function geometry() {
  const s = cfg.shape;
  const foot = cfg.goal || cfg.topGiver ? Math.max(44, H * ((cfg.goal ? 0.08 : 0) + (cfg.topGiver ? 0.07 : 0))) : 0; // goal bar + top giver under the jar
  const HH = H - foot;
  const TH = window.JAR_THEMES && Object.hasOwn(window.JAR_THEMES, s) ? window.JAR_THEMES[s] : null;
  if (TH) { // 🏭 a themed container (jar-themes.js)
    const g = { T: TH, cx: W / 2, foot, floor: HH - Math.max(14, H * 0.035), lidH: 0, wall: 4 };
    TH.geo(g, { W, H, HH, floor: g.floor });
    g.wall = Math.max(4, g.half * 0.035);
    if (g.ceil == null) g.ceil = g.top;
    if (g.spawn == null) g.spawn = g.top + (g.bottom - g.top) * 0.06;
    if (g.neck == null) g.neck = g.hw(g.top - 1);
    g.entry = TH.entry || 'drop'; g.damp = TH.damp; g.interval = TH.interval; g.open = !!TH.open;
    if (g.open) g.ceil = -1e9;
    g.r = Math.max(8, g.half * 0.15 * (cfg.itemSize || 1));
    return g;
  }
  const maxW = Math.min(W * 0.86, HH * (s === 'tall' ? 0.5 : s === 'round' ? 0.78 : 0.66));
  const cx = W / 2;
  const half = maxW / 2;
  const lidH = cfg.lid === 'none' ? 0 : Math.max(18, half * 0.2);
  const top = H * 0.05 + lidH * (cfg.lid === 'none' ? 1 : 1.9) + half * 0.08; // room above for the lid to be pushed up           // inside top (mouth)
  const bottom = HH - Math.max(14, H * 0.035);         // inside bottom
  const g = { cx, half, top, bottom, lidH, foot, neck: half * 0.78, wall: Math.max(4, half * 0.035) };
  const hgt = bottom - top;
  if (s === 'round') {
    const R = Math.min(half, hgt / 1.8);
    g.half = R; g.cy = bottom - R; g.top = Math.max(top, g.cy - R * 0.93); g.neck = Math.sqrt(R * R - (g.top - g.cy) ** 2);
    g.hw = y => y < g.top ? g.neck : y > bottom ? 0 : Math.sqrt(Math.max(0, R * R - (y - g.cy) ** 2));
  } else if (s === 'heart') {
    // a real heart: two round lobes and a point; the mouth is a short glass neck in the dip between the lobes
    const raw = []; for (let i = 0; i <= 200; i++) { const t = (i / 200) * Math.PI * 2; raw.push([16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]); }
    const yMin = Math.min(...raw.map(p => p[1])), yMax = Math.max(...raw.map(p => p[1]));
    const H0 = Math.min(hgt * 0.9, half * 2 * (yMax - yMin) / 32), sc = H0 / (yMax - yMin), hx = Math.min(half, 16 * sc);
    const lobeTop = bottom - H0;
    g.poly = raw.map(([x, y]) => [cx + x * hx / 16, lobeTop + (y - yMin) * sc]);
    g.half = hx; g.ceil = lobeTop; g.neck = hx * 0.24;
    g.dipY = lobeTop + (-5 - yMin) * sc; g.top = lobeTop - hx * 0.16;
    g.neckBottom = Math.min(...g.poly.filter(([x, y]) => Math.abs(x - cx) <= g.neck && y < lobeTop + (g.dipY - lobeTop) * 1.5).map(p => p[1]), g.dipY);
    const rows = new Map(); // half-width of the heart at each pixel row
    g.hw = y => {
      if (y < lobeTop) return y >= g.top ? g.neck : 0;
      const k = Math.round(y); if (rows.has(k)) return rows.get(k);
      let w = 0; for (let i = 0; i < g.poly.length - 1; i++) { const [x1, y1] = g.poly[i], [x2, y2] = g.poly[i + 1]; if ((y1 - k) * (y2 - k) <= 0 && y1 !== y2) w = Math.max(w, Math.abs(x1 + (x2 - x1) * (k - y1) / (y2 - y1) - cx)); }
      rows.set(k, w); return w;
    };
  } else { // jar / tall: neck, shoulder, straight body, rounded bottom corners
    const R = half * 0.28, sh = hgt * 0.1;
    g.hw = y => {
      if (y < top) return g.neck;
      if (y > bottom) return 0;
      if (y < top + sh * 0.4) return g.neck;
      if (y < top + sh) { const u = (y - top - sh * 0.4) / (sh * 0.6); return g.neck + (half - g.neck) * (1 - (1 - u) ** 2); }
      if (y > bottom - R) return half - R + Math.sqrt(Math.max(0, R * R - (y - bottom + R) ** 2));
      return half;
    };
  }
  if (g.ceil == null) g.ceil = g.top; // pictures never rise above this (the lid)
  g.floor = g.bottom; g.open = cfg.lid === 'none'; if (g.open) g.ceil = -1e9;
  g.liftable = !g.open && !g.poly; g.maxLift = Math.max(0, Math.min(g.lidH * 1.1 + g.half * 0.08, g.top - g.lidH * 1.6 - 4)); // 🫙 a stuffed jar pushes its lid up (it never goes through)
  g.spawn = s === 'heart' ? g.dipY + (g.bottom - g.dipY) * 0.08 : g.top + (g.bottom - g.top) * 0.06;
  g.r = Math.max(8, g.half * 0.15 * (cfg.itemSize || 1)); // picture radius
  return g;
}
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const old = J; J = geometry();
  if (old && items.length) { for (const it of items) { it.r = J.r * it.k; } settle(240); }
}
addEventListener('resize', resize);

// ---------- physics ----------
const GRAV = 2200;
function newItem(o, x, y) {
  if (typeof o === 'string') o = { p: o };
  const k = (0.88 + Math.random() * 0.24) * (Number(o.s) || 1);
  return { img: getImg(o.p), x, y, px: x, py: y, r: J.r * k, k, glow: !!o.g, ph: Math.random() * 6.28, rot: Math.random() * 6.28, vr: 0, out: false, alpha: 1, landed: false };
}
function drop(src) {
  J.T?.onDrop?.(J);
  if (J.entry === 'belt') { // 🏭 rides the conveyor, then falls into the crate
    const it = newItem(src, J.belt.x0, J.belt.y), y = J.belt.y - it.r; it.y = it.py = y;
    it.carry = { x0: J.belt.x0, y0: y, x1: J.belt.x1, y1: y, t: 0, dur: (J.belt.x1 - J.belt.x0) / Math.max(120, W * 0.45) }; items.push(it); return;
  }
  if (J.entry === 'claw') { // 🕹️ the claw brings it in and lets go
    const it = newItem(src, J.home, J.top + 30), y = J.top + 30 + it.r * 0.6, tx = J.cx + (Math.random() - 0.5) * Math.max(0, J.half - it.r) * 1.7;
    it.y = it.py = y; it.carry = { x0: J.home, y0: y, x1: tx, y1: y, t: 0, dur: 0.6, claw: true }; items.push(it); return;
  }
  let y = J.spawn + J.r;
  if (J.open || J.liftable) { let pile = Infinity; for (const o of items) if (o.landed && !o.out && !o.spill && !o.carry && Math.abs(o.x - J.cx) < J.neck + o.r) pile = Math.min(pile, o.y - o.r); if (pile - J.r * 1.2 < y) y = Math.max(J.r, J.liftable ? J.ceil - lidLift + J.r : -1e9, pile - J.r * 1.2); } // drop in on top of the pile
  const w = J.entry === 'slot' ? Math.min(J.slotW || J.r * 2, Math.max(0, J.hw(y) - J.r * 1.2) * 2) * 0.5 : Math.max(0, J.hw(y) - J.r * 1.2);
  const it = newItem(src, J.cx + (Math.random() - 0.5) * w * 1.6, y);
  it.py = it.y - 3; it.grow = 0; items.push(it);
  if (cfg.sparkle) for (let i = 0; i < 6; i++) { const a = Math.random() * 6.28, sp = 80 + Math.random() * 120; sparks.push({ x: it.x, y: it.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: 0.5 }); }
}
// Verlet steps: gravity, keep each picture inside the glass, push overlapping pictures apart
function step(dt) {
  const dm = J.damp || 0.99;
  for (const it of items) {
    if (it.carry) { // carried by the belt or the claw: follows its path, no physics yet
      const c = it.carry; c.t += dt; const k = Math.min(1, c.t / c.dur);
      it.x = c.x0 + (c.x1 - c.x0) * k; it.y = c.y0 + (c.y1 - c.y0) * k; it.px = it.x; it.py = it.y;
      if (!c.claw) it.rot += dt * (J.belt ? (J.belt.x1 - J.belt.x0) / c.dur / it.r : 0);
      if (k >= 1) { delete it.carry; if (!c.claw) it.px = it.x - 2.5; }
      continue;
    }
    const lim = it.out ? 1e9 : J.r * 0.6; // no gift gets flung out by a squeeze
    const vx = Math.max(-lim, Math.min(lim, (it.x - it.px) * dm)), vy = Math.max(it.spill ? -J.r * 0.08 : -lim, Math.min(lim, (it.y - it.py) * dm)); // spilled gifts tumble down, they don't fly up
    it.px = it.x; it.py = it.y;
    it.x += vx; it.y += vy + GRAV * dt * dt * (it.out ? 1 : 1);
    it.rot += it.out ? it.vr * dt : vx / it.r;
  }
  lidPush = 0; lidSide = 0;
  for (let k = 0; k < 3; k++) { collide(); for (const it of items) if (!it.out && !it.carry) walls(it); }
  if (J.liftable) { // the lid rides on the pile: pushed up while gifts press on it, settles back down when they don't
    if (lidPush >= 3) lidLift = Math.min(J.maxLift, lidLift + J.r * 0.006 * Math.min(3, lidPush / 3)); else lidLift = Math.max(0, lidLift - J.r * 0.012);
    const want = lidPush ? Math.max(-0.22, Math.min(0.22, lidSide / (J.half * Math.max(3, lidPush)) * 0.5)) : 0;
    lidTilt += (want * Math.min(1, lidLift / (J.lidH + 1)) - lidTilt) * 0.04;
  }
}
// 🌊 no lid: gifts that roll over the rim fall down outside and land on the floor beside it
function spillWalls(it) {
  const r = it.r;
  if (it.y + r > J.floor) { it.y = J.floor - r; if (!it.landed) land(it); }
  if (it.x < r) it.x = r; if (it.x > W - r) it.x = W - r; if (it.y < r) it.y = r; // stays on screen
  if (it.y + r * 0.5 > J.top) { const yy = Math.max(J.top, Math.min(J.bottom, it.y)), edge = J.hw(yy) + J.wall + r * 0.9, dx = it.x - J.cx; if (Math.abs(dx) < edge) it.x = J.cx + (dx < 0 ? -1 : 1) * edge; }
  if (J.liftable && J.lidH) { // the lifted lid is solid too: gifts coming out underneath go sideways, not through it
    const lt = J.top - J.wall * 0.3 - J.lidH * 1.2 - lidLift, lb = J.top, lh = J.neck + J.wall * 2.6 + r * 0.8, dx = it.x - J.cx;
    if (Math.abs(dx) < lh && it.y + r * 0.6 > lt && it.y < lb) { if (it.y < lt + r * 0.2) it.y = lt - r * 0.6; else it.x = J.cx + (dx < 0 ? -1 : 1) * lh; }
  }
}
function walls(it) {
  if (it.spill) return spillWalls(it);
  const r = it.r, cx = J.cx;
  const gap = J.liftable && lidLift > r * 1.1; // lid pushed up far enough: gifts can slip out under it
  if ((J.open && it.y < J.top && (Math.abs(it.x - cx) > J.hw(J.top) + J.wall || it.y < J.top - J.half * 0.5)) || (gap && it.y < J.top - r * 0.3 && Math.abs(it.x - cx) > J.neck - r * 0.6)) { it.spill = true; it.spillAt = performance.now(); it.landed = false; const out = it.x < cx ? -1 : 1; it.px = it.x - out * r * 0.12; it.py = Math.max(it.py, it.y); return spillWalls(it); } // tips over the edge and away
  const ceil = J.ceil - (J.liftable ? lidLift : 0);
  if (it.y < ceil + r * 0.8) { it.y = ceil + r * 0.8; if (J.liftable) { lidPush++; lidSide += it.x - J.cx; } } // the lid
  // test points around the picture's edge against the glass
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    if (sa < -0.5) continue; // upper edge never touches glass
    const px = it.x + ca * r, py = it.y + sa * r;
    if ((J.open || gap) && py < J.top) continue; // above an open rim: nothing holds it in
    const hw = J.hw(py);
    let dx = 0, dy = 0;
    if (py > J.bottom) dy = J.bottom - py;
    else if (Math.abs(px - cx) > hw) {
      const over = Math.abs(px - cx) - hw;
      if (hw <= 0.5) dy = -over; else { dx = -Math.sign(px - cx) * over * Math.abs(ca); dy = -over * Math.max(0, sa); }
    }
    if (dx || dy) { it.x += dx; it.y += dy; if (!it.landed && dy < 0) land(it); }
  }
  if (it.y < ceil + r * 0.8) it.y = ceil + r * 0.8; // squeezed against the glass: still never past the lid
}
function collide() {
  const cell = J.r * 2.4, grid = new Map();
  for (let i = 0; i < items.length; i++) {
    const it = items[i]; if (it.out || it.carry) continue;
    const key = Math.floor(it.x / cell) + ',' + Math.floor(it.y / cell);
    (grid.get(key) || grid.set(key, []).get(key)).push(i);
  }
  for (let i = 0; i < items.length; i++) {
    const a = items[i]; if (a.out || a.carry) continue;
    const gx = Math.floor(a.x / cell), gy = Math.floor(a.y / cell);
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const list = grid.get((gx + ox) + ',' + (gy + oy)); if (!list) continue;
      for (const j of list) {
        if (j <= i) continue;
        const b = items[j]; if (b.carry) continue; const dx = b.x - a.x, dy = b.y - a.y, min = (a.r + b.r) * 0.9, d2 = dx * dx + dy * dy;
        if (d2 >= min * min || d2 === 0) continue;
        const d = Math.sqrt(d2), push = (min - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;

}
let lastClink = 0;
function land(it) {

  if (!PREVIEW && cfg.sound && performance.now() - lastClink > 90) { lastClink = performance.now(); KBSound.play('bubble', (cfg.volume ?? 0.4) * 0.6); }
  if (cfg.sparkle && Math.random() < 0.5) for (let i = 0; i < 3; i++) { const a = Math.random() * 6.28, s = 60 + Math.random() * 90; sparks.push({ x: it.x, y: it.y - it.r * 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, age: 0, life: 0.6 }); }
}
// 📳 shake: the jar rattles and everything inside jumps
function shake(power) {
  shakeT = 0.9 + 0.3 * power; shakePow = Math.min(3, power);
  for (const it of items) if (!it.out) { it.py = it.y + (6 + Math.random() * 10) * power; it.px = it.x + (Math.random() - 0.5) * 10 * power; it.landed = false; }
  if (!PREVIEW && cfg.sound) KBSound.play('rumble', cfg.volume ?? 0.4);
}
// floating "+กุหลาบ ×5 · name" tags (a few at a time)
function addTag(text, color) { tagQ.push({ text, color }); if (tagQ.length > 12) tagQ.shift(); }
// 🎉 jar full: lid pops off, confetti, everything bursts out, then the lid comes back
function celebrate(pourOut = true) {
  dropHold = performance.now() + 2600;
  party = { t: 0, lid: { dy: 0, vy: -900, rot: 0, vr: (Math.random() < 0.5 ? -1 : 1) * 2.2 } };
  const cols = ['#ff4f8b', '#ffd23f', '#5ce1e6', '#7cf29c', '#b28dff', '#ffffff'];
  for (let i = 0; i < 160; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, sp = 350 + Math.random() * 650; confetti.push({ x: J.cx, y: J.top, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 16, c: cols[i % cols.length], w: 6 + Math.random() * 8, age: 0 }); }
  if (pourOut) for (const it of items) if (!it.out) { it.out = true; it.vr = (Math.random() - 0.5) * 14; it.px = it.x - (Math.random() - 0.5) * 26; it.py = it.y + 22 + Math.random() * 22; }
  else dropHold = 0;
  angV += 1.2; shakeT = 0.6; shakePow = 1.5;

}
// put saved pictures straight into the jar (page opened or reloaded)
function settle(n) { for (let i = 0; i < n; i++) step(1 / 60); for (const it of items) { it.px = it.x; it.py = it.y; it.landed = true; } }
function fillNow(list) {
  items.length = 0;
  let row = 0, col = 0;
  for (const src of list) {
    const y = J.bottom - J.r - row * J.r * 1.7, hw = Math.max(J.r, J.hw(y) - J.r), per = Math.max(1, Math.floor(hw * 2 / (J.r * 1.8)));
    const x = J.cx - hw + (col + 0.5) * (hw * 2 / per);
    const it = newItem(src, x + (Math.random() - 0.5) * 2, y); it.landed = true; items.push(it);
    if (++col >= per) { col = 0; row++; }
  }

}
// pour everything out (jar was full, or "🫗 เทโหล" was pressed)
function pour() {
  for (const it of items) { if (it.out) continue; it.out = true; it.vr = (Math.random() - 0.5) * 14; it.px = it.x - (Math.random() - 0.5) * 18; it.py = it.y + 14 + Math.random() * 14; }
  if (!PREVIEW && cfg.sound) KBSound.play('whoosh', cfg.volume ?? 0.4);
}

// ---------- drawing ----------
function rgba(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function outline(pad) { // the glass outline as a path (pad: grow outward)

  for (let i = 0; i <= n; i++) { const y = J.top + (J.bottom - J.top) * (i / n); pts.push([J.hw(y) + pad, y]); }

  ws.onclose = () => { if (!PREVIEW) document.getElementById('status').style.display = 'block'; setTimeout(connect, 2000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'jarInit') { Object.assign(cfg, m.cfg || {}); total = m.total || 0; best = m.top || null; J = geometry(); dropQ.length = 0; fillNow((m.items || []).slice(-400)); }
    else if (m.t === 'jarCfg') { const before = cfg.shape + cfg.itemSize + cfg.lid + cfg.goal + cfg.topGiver; Object.assign(cfg, m.cfg || {}); if (before !== cfg.shape + cfg.itemSize + cfg.lid + cfg.goal + cfg.topGiver) { J = geometry(); for (const it of items) it.r = J.r * it.k; settle(240); } }
    else if (m.t === 'jarAdd') {
      total = m.total ?? total; if (m.top !== undefined) best = m.top;
      if (m.tag && cfg.names) addTag(`+${m.tag.gift}${m.tag.count > 1 ? ' ×' + m.tag.count : ''} · ${m.tag.name}`);
      if (m.shake) shake(m.shake);
      queueDrops(m.items || []);
    }
    else if (m.t === 'jarFull') { dropQ.length = 0; celebrate(); }
    else if (m.t === 'jarGoal') celebrate(false); // open container just got full: party, gifts keep spilling over
    else if (m.t === 'jarShake') { shake(m.power || 1); if (m.by && cfg.names) addTag(`📳 ${m.by} เขย่าโหล!`, '#7c5cff'); }
    else if (m.t === 'jarPour') { if (m.total != null) total = m.total; if ('top' in m) best = m.top; dropQ.length = 0; pour(); }
  };
}
resize(); J = geometry();
requestAnimationFrame(frame);
connect();
</script>
