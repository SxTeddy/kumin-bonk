<script>

const imgCache = new Map();
function srcUrl(src) {

  if (it.y + r * 0.5 > J.top) { const yy = Math.max(J.top, Math.min(J.bottom, it.y)), edge = J.hw(yy) + J.wall + r * 0.9, dx = it.x - J.cx; if (Math.abs(dx) < edge) it.x = J.cx + (dx < 0 ? -1 : 1) * edge; }

  if (party.t < 2.6) { l.vy += 1400 * dt; l.dy += l.vy * dt; l.rot += l.vr * dt; if (l.dy > 0 && l.vy > 0) { l.dy = 0; l.vy *= -0.4; l.vr *= 0.5; } }
  else { l.dy *= 0.85; l.rot *= 0.85; }
  if (party.t < 2.8) {
    const k = Math.min(1, party.t * 4) * (party.t > 2.3 ? (2.8 - party.t) / 0.5 : 1), fs = Math.max(20, Math.min(54, W * 0.08));
    ctx.save(); ctx.translate(J.cx, (J.top + J.bottom) / 2); ctx.scale(0.6 + 0.4 * k, 0.6 + 0.4 * k);
    pill('🎉 เต็มโหลแล้ว!', 0, 0, fs, '#ff4f8b', '#fff', k); ctx.restore();
  }
  if (party.t > 3.4) party = null;
}
// each gift is drawn once into a small ready-made picture (with its shadow / capsule) and then just stamped every frame:
// much lighter for LIVE Studio than redrawing shadows for 100+ gifts 60 times a second
const sprites = new Map();
function makeSprite(key, px, paint) {
  let c = sprites.get(key); if (c) return c;
  const d = Math.min(2, devicePixelRatio || 1), pad = Math.ceil(px * 0.2), w = px + pad * 2;
  c = document.createElement('canvas'); c.width = c.height = Math.ceil(w * d); c.size = w;
  const g = c.getContext('2d'); g.scale(d, d); g.translate(w / 2, w / 2);
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = Math.min(10, px * 0.14); g.shadowOffsetY = px * 0.06;
  paint(g, px);

  sprites.set(key, c); return c;
}
const bucket = size => Math.max(8, Math.round(size / 4) * 4);
function giftSprite(im, size) {
  const px = bucket(size);
  return makeSprite(im.src + '|' + px, px, (g, s) => { const q = im.naturalWidth / im.naturalHeight || 1, iw = q >= 1 ? s : s * q, ih = q >= 1 ? s / q : s; g.drawImage(im, -iw / 2, -ih / 2, iw, ih); });
}
function capsuleSprite(size, hue) { // 🍬 gacha capsule around the gift
  const px = bucket(size), hb = Math.floor(hue / 45);
  return makeSprite('cap|' + hb + '|' + px, px, (g, s) => {
    const r = s * 0.5; g.beginPath(); g.arc(0, 0, r, 0, 6.2832); g.fillStyle = 'rgba(255,255,255,.35)'; g.fill(); g.shadowColor = 'transparent';
    g.beginPath(); g.arc(0, 0, r, Math.PI, 6.2832); g.closePath(); g.fillStyle = `hsla(${hb * 45 + 20},85%,65%,.8)`; g.fill();
    g.beginPath(); g.arc(0, 0, r, 0, 6.2832); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2; g.stroke();
  });
}
const stamp = (c, size) => { const k = size / bucket(size); ctx.drawImage(c, -c.size * k / 2, -c.size * k / 2, c.size * k, c.size * k); };
function drawItem(it) {
  if (it.grow != null && it.grow < 1) it.grow = Math.min(1, it.grow + 0.08);
  const s = it.r * 2 * (it.grow == null ? 1 : 0.3 + 0.7 * it.grow), im = it.img;
  // draw at a smoothed position: tiny back-and-forth nudges between packed gifts don't show as shaking
  if (it.sx == null || it.out || it.carry || Math.abs(it.sx - it.x) + Math.abs(it.sy - it.y) > it.r) { it.sx = it.x; it.sy = it.y; it.sr = it.rot; }
  else { it.sx += (it.x - it.sx) * 0.25; it.sy += (it.y - it.sy) * 0.25; it.sr += (it.rot - it.sr) * 0.25; }
  ctx.save(); ctx.globalAlpha = it.alpha; ctx.translate(it.sx, it.sy); ctx.rotate(it.sr);
  const cap = J.T?.capsule;
  if (cap) stamp(capsuleSprite(s, (it.ph * 57) % 360), s);
  if (im.complete && !im.failed && im.naturalWidth) stamp(giftSprite(im, cap ? s * 0.72 : s), cap ? s * 0.72 : s);

}

let last = performance.now(), acc = 0;
let tnow = 0, fdt = 0, dirty = true, lastDraw = 0;
const perf = { raf: 0, draws: 0, ms: 0, t0: performance.now() };
function stillLife() { // nothing on screen is moving: no need to paint the same picture again
  if (calm <= 120 || dropQ.length || shakeT > 0 || party || tags.length || tagQ.length || sparks.length || confetti.length) return false;
  if (Math.abs(ang) > 0.001 || Math.abs(angV) > 0.01) return false;
  for (const it of items) if (it.spill || it.out || it.carry || (it.grow != null && it.grow < 1)) return false;
  return true;
}
function frame(now) {
  requestAnimationFrame(frame); // keep going no matter what happens below
  perf.raf++;
  if (W < 60 || H < 60 || !J || !(J.half > 0)) { last = now; return; } // hidden or tiny (e.g. the preview while its tab is closed): nothing to draw yet
  if (lite()) {
    const gap = now - lastDraw;
    if (gap < 1000 / 30 - 3) return; // 30 frames a second is plenty for a jar
    if (!dirty && stillLife()) { // asleep: animated themes / glowing gifts tick slowly, a still glass jar not at all
      const slow = J.T || items.some(i => i.glow);
      if (gap < (slow ? 1000 / 12 : 1000)) return;
    }
  }
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tnow = now; fdt = dt; lastDraw = now; dirty = false;
  const t0 = performance.now();
  try { drawScene(now, dt); } catch (e) { console.error('jar', e); }
  perf.draws++; perf.ms += performance.now() - t0;
}
setInterval(() => { // 📈 tell the app how smooth the jar runs here
  const now = performance.now(), sec = (now - perf.t0) / 1000;
  if (sock && sock.readyState === 1 && sec > 0) sock.send(JSON.stringify({ t: 'fps', fps: perf.raf / sec, ms: perf.draws ? perf.ms / perf.draws : 0, lite: lite(), preview: PREVIEW }));
  perf.raf = perf.draws = perf.ms = 0; perf.t0 = now;
}, 5000);
function drawScene(now, dt) {
  acc += dt;
  if (calm > 120 && !dropQ.length && shakeT <= 0) acc = 0; // asleep
  if (lite() && acc > 1 / 30) acc = 1 / 30; // a slow frame doesn't pile up extra physics (that is what snowballs into lag)
  const h = lite() ? 1 / 60 : 1 / 120;
  while (acc >= h) { step(h); acc -= h; }
  let spilled = 0;
  for (let i = items.length - 1; i >= 0; i--) { const it = items[i]; if (it.spill && !it.out && (now - it.spillAt > (lite() ? 4000 : 6000) || ++spilled > (lite() ? 24 : 45))) { it.alpha -= dt * 0.8; if (it.alpha <= 0) { items.splice(i, 1); continue; } } if (it.out) { it.alpha -= dt * 0.8; if (it.alpha <= 0 || it.y > H + 200) items.splice(i, 1); } }
  // rocking jar (spring) + shaking
  angV += (-ang * 70 - angV * 6) * dt; ang += angV * dt; ang = Math.max(-0.25, Math.min(0.25, ang));
  let sx = 0; if (shakeT > 0) { shakeT -= dt; sx = Math.sin(now / 22) * 9 * shakePow * Math.max(0, shakeT); ang += Math.sin(now / 37) * 0.012 * shakePow * Math.max(0, shakeT); }
  ctx.clearRect(0, 0, W, H);
  floorShadow();
  ctx.save(); ctx.translate(J.cx + sx, J.floor); ctx.rotate(ang); ctx.translate(-J.cx, -J.floor);
  drawBack();
  for (const it of items) if (!it.out && !it.carry && !it.spill && it.glow) drawGlow(it, now);
  for (const it of items) if (!it.out && !it.carry && !it.spill) drawItem(it);
  drawFront();
  J.busy = false;
  for (const it of items) if (it.carry) { drawItem(it); if (it.carry.claw) { J.busy = true; J.T.drawClaw(J, it.x, it.y - it.r * 0.6, false); } }
  ctx.restore();
  for (const it of items) if (it.spill && !it.out) { if (it.glow) drawGlow(it, now); drawItem(it); }
  for (const it of items) if (it.out) drawItem(it);
  drawFoot();
  drawTags(dt);
  drawParty(dt);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * dt;
    if (s.age > s.life) { sparks.splice(i, 1); continue; }
    const k = 1 - s.age / s.life; ctx.globalAlpha = k; ctx.fillStyle = '#fff6a8';
    ctx.beginPath(); const r = 2 + 4 * k; ctx.moveTo(s.x, s.y - r * 2); ctx.lineTo(s.x + r * 0.6, s.y); ctx.lineTo(s.x, s.y + r * 2); ctx.lineTo(s.x - r * 0.6, s.y); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- connection ----------
const dropQ = []; let dropT = null, dropHold = 0;
function queueDrops(list) { dropQ.push(...list); if (dropQ.length > 400) dropQ.splice(0, dropQ.length - 400); if (!dropT) dropT = setInterval(() => { if (performance.now() < dropHold) return; const s = dropQ.shift(); if (s) drop(s); else { clearInterval(dropT); dropT = null; } }, (J && J.interval) || 110); }
let sock = null;
function connect() {
  const ws = sock = new WebSocket(`ws://${location.host}/ws?role=jar`);
  ws.onopen = () => { document.getElementById('status').style.display = 'none'; };
  ws.onclose = () => { if (!PREVIEW) document.getElementById('status').style.display = 'block'; setTimeout(connect, 2000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data); dirty = true; if (m.t !== 'jarAdd' || (m.items || []).length) wake();
    if (m.t === 'jarInit') { Object.assign(cfg, m.cfg || {}); total = m.total || 0; coinsTotal = m.coins || 0; best = m.top || null; J = geometry(); dropQ.length = 0; fillNow((m.items || []).slice(-400)); }
    else if (m.t === 'jarCfg') { wake(); const wasLite = lite(); const before = cfg.shape + cfg.itemSize + cfg.lid + cfg.goal + cfg.topGiver; Object.assign(cfg, m.cfg || {}); layers.clear(); if (wasLite !== lite()) resize(); if (before !== cfg.shape + cfg.itemSize + cfg.lid + cfg.goal + cfg.topGiver) { J = geometry(); refit(); settle(240); } }
    else if (m.t === 'jarAdd') {

    else if (m.t === 'jarGoal') celebrate(false); // open container just got full: party, gifts keep spilling over

    else if (m.t === 'jarPour') { if (m.total != null) total = m.total; if (m.coins != null) coinsTotal = m.coins; if ('top' in m) best = m.top; dropQ.length = 0; pour(); }

resize(); J = geometry();
requestAnimationFrame(frame);
connect();
